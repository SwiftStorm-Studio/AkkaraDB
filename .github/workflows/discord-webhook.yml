name: Trigger Discord Webhook (Actions Repo)

on:
  push:
    branches:
      - '**'

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

  issues:
    types:
      - opened
      - reopened
      - edited
      - closed

jobs:
  trigger-actions-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Discord Webhook
        env:
          GH_TOKEN: ${{ secrets.PAT }}

          EVENT_JSON: ${{ toJSON(github.event) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}

          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}

        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            push)
              EVENT_TYPE="commit"
              ;;
            pull_request)
              EVENT_TYPE="pull-request"
              ;;
            issues)
              EVENT_TYPE="issues"
              ;;
            *)
              echo "Unsupported event type: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          PAYLOAD="$(
            jq -c \
              --arg repo "$REPOSITORY" \
              --arg branch "$BRANCH_NAME" \
              --arg event_type "$EVENT_TYPE" \
              --arg event_action "$EVENT_ACTION" \
              --arg sha "$COMMIT_SHA" \
              --arg actor "$ACTOR" \
              '{
                repo_name: $repo,
                branch_name: $branch,
                event_type: $event_type,
                event_action: $event_action,

                commit_sha: $sha,
                commit_message: (
                  .head_commit.message
                  // .pull_request.title
                  // .issue.title
                  // "No message"
                ),
                commit_author: $actor,

                pr_title: (.pull_request.title // ""),
                pr_body: (.pull_request.body // ""),
                pr_number: (.pull_request.number // 0),
                pr_url: (.pull_request.html_url // ""),
                pr_author: (.pull_request.user.login // ""),
                pr_state: (.pull_request.state // ""),
                pr_merged: (.pull_request.merged // false),

                issue_title: (.issue.title // ""),
                issue_body: (.issue.body // ""),
                issue_number: (.issue.number // 0),
                issue_url: (.issue.html_url // ""),
                issue_author: (.issue.user.login // ""),
                issue_state: (.issue.state // "")
              }' <<< "$EVENT_JSON"
          )"

          ENCODED_PAYLOAD="$(
            printf '%s' "$PAYLOAD" | base64 -w 0
          )"

          gh workflow run github-to-discord.yml \
            --repo ririf4/Actions \
            --ref main \
            --field payload="$ENCODED_PAYLOAD"